[versions]
kotlin-jvm = "2.2.0"
plugin-spring = "2.2.0"
plugin-jpa = "2.2.0"
flyway = "9.22.0"
spring-boot = "3.5.11"
spring-dependency-management = "1.1.7"
springdoc-openapi = "2.8.0"
jwt = "0.12.6"
testcontainers = "2.0.3"
kotest = "5.7.2"
kotest-spring = "1.1.3"
mockk = "1.13.5"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin-jvm" }
kotlin-plugin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "plugin-spring" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "plugin-jpa" }
flyway = { id = "org.flywaydb.flyway", version.ref = "flyway" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }

[libraries]
springdoc-openapi = { group = "org.springdoc", name = "springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc-openapi" }
archunit = { group = "com.tngtech.archunit", name = "archunit", version = "1.3.0" }
jwt-api = { group = "io.jsonwebtoken", name = "jjwt-api", version.ref = "jwt" }
jwt-impl = { group = "io.jsonwebtoken", name = "jjwt-impl", version.ref = "jwt" }
jwt-jackson = { group = "io.jsonwebtoken", name = "jjwt-jackson", version.ref = "jwt" }
mockito-kotlin = {group = "org.mockito.kotlin", name = "mockito-kotlin", version = "6.2.3" }
mockito-core = { group = "org.mockito", name = "mockito-core", version = "5.11.0" }

# DB / Jackson / Flyway libraries
postgresql = { group = "org.postgresql", name = "postgresql", version = "42.7.7" }
h2 = { group = "com.h2database", name = "h2", version = "2.2.224" }
jackson-module-kotlin = { group = "com.fasterxml.jackson.module", name = "jackson-module-kotlin" }
flyway-core = { group = "org.flywaydb", name = "flyway-core", version.ref = "flyway" }

# Kotest and MockK
kotest-runner-junit5 = { group = "io.kotest", name = "kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { group = "io.kotest", name = "kotest-assertions-core", version.ref = "kotest" }
kotest-extensions-spring = { group = "io.kotest.extensions", name = "kotest-extensions-spring", version.ref = "kotest-spring" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }

# Testcontainers BOM only (keep BOM versioned)
# the BOM import will provide Individual Testcontainers module versions in the build
testcontainers-bom = { group = "org.testcontainers", name = "testcontainers-bom", version.ref = "testcontainers" }

# Add module aliases and a bundle so build scripts can refer to libs.bundles.testcontainers
testcontainersJunit = { group = "org.testcontainers", name = "junit-jupiter"}
testcontainersPostgresql = { group = "org.testcontainers", name = "postgresql" }

[bundles]
# Convenience bundle to pull Testcontainers modules with one alias
testcontainers = ["testcontainersJunit", "testcontainersPostgresql"]
# Kotest bundle to use in build.gradle.kts
kotest = ["kotest-runner-junit5", "kotest-assertions-core", "kotest-extensions-spring"]
